<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <main class="login-card">
        <div class="login-icon">☁</div>
        <h1>Login Admin</h1>
        <p>Masuk untuk mengubah data anggota kelompok.</p>

        <form action="backend/login.php" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="Masukkan username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Masukkan password" required>
            </div>

            <button class="btn-submit" type="submit">Login</button>
        </form>

        <p class="login-help">Default: username <b>admin</b>, password <b>123</b></p>
        <a class="back-link" href="index.php">← Kembali ke Beranda</a>
    </main>

</body>
</html>
